{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block classe_body %}page-foret{% endblock %}

{% block contenu %}
<section class="container">
  <div class="carte-auth mx-auto p-4 p-md-5">
    <a href="{{ url_for('main.index') }}" class="fermer-carte" aria-label="Fermer et revenir à l'accueil">&times;</a>

    <h1 class="titre-carte text-center mb-4">Connexion</h1>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="champ-verre mb-4">
        <label for="email" class="visually-hidden">Adresse Gmail</label>
        <input type="email" class="form-control" id="email" name="email" required
               placeholder="Email" autofocus>
        <i class="bi bi-envelope"></i>
      </div>
      <div class="champ-verre mb-3">
        <label for="password" class="visually-hidden">Mot de passe</label>
        <input type="password" class="form-control" id="password" name="password" required
               placeholder="Mot de passe">
        <i class="bi bi-lock"></i>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" name="remember" id="remember">
        <label class="form-check-label" for="remember">Rester connecté</label>
      </div>
      <button type="submit" class="btn btn-or btn-lg w-100">Connexion</button>
    </form>

    <p class="text-center mt-4 mb-0 petit">
      {% if not current_user.is_authenticated %}
        Pas encore de compte ?
        <a href="{{ url_for('auth.inscription') }}" class="lien-or fw-bold">Inscription</a>
      {% endif %}
    </p>
  </div>
</section>
{% endblock %}
