{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}

{% block contenu %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="carte-auth p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="icone-rond mx-auto mb-3"><i class="bi bi-person-circle"></i></div>
          <h1 class="h3 mb-1">Connexion</h1>
          <p class="text-muted mb-0">Accédez à toutes les ressources de la plateforme.</p>
        </div>

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="email" class="form-label">Adresse Gmail</label>
            <input type="email" class="form-control" id="email" name="email" required
                   placeholder="vous@gmail.com" autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="remember" id="remember">
            <label class="form-check-label" for="remember">Rester connecté</label>
          </div>
          <button type="submit" class="btn btn-or btn-lg w-100">Se connecter</button>
        </form>

        <p class="text-center mt-4 mb-0">
          {% if not current_user.is_authenticated %}
            Pas encore de compte ?
            <a href="{{ url_for('auth.inscription') }}" class="lien-or">Inscrivez-vous gratuitement</a>
          {% endif %}
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
